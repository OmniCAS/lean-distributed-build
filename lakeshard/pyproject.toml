[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeshard"
version = "0.2.0"
description = "Split a Lean/Lake project along its import graph, build the shards on several workers, and assemble and verify the result."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lakeshard = "lakeshard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: needs a Lean toolchain (elan) on this machine"]
